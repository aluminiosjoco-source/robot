<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Eyes Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background-color: #0a0a0a;
        }
        
        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        #grid-canvas,
        #sat-canvas,
        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #grid-canvas {
            z-index: 1;
        }
        
        #line-canvas {
            z-index: 2;
        }
        
        #sat-canvas {
            z-index: 3;
        }
        
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- SVG Background -->
    <svg 
        id="bg-svg" 
        xmlns="http://www.w3.org/2000/svg"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.08; pointer-events: none;"
    >
        <defs>
            <pattern id="eye-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                <circle cx="20" cy="20" r="12" fill="none" stroke="#ffffff" stroke-width="0.5"/>
                <circle cx="24" cy="20" r="4" fill="#ffffff"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#eye-pattern)" />
    </svg>

    <!-- Capas de renderizado -->
    <div class="canvas-container">
        <canvas id="grid-canvas"></canvas>
        <canvas id="line-canvas"></canvas>
        <canvas id="sat-canvas"></canvas>
    </div>

    <!-- Capa UI para eventos -->
    <div id="ui-layer"></div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
